name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-bundle:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - name: Check native prerequisites
        run: bash scripts/setup.sh --check
      - name: Install dependencies
        run: npm ci
      - name: Validate authored authority
        run: npm run check:manifests
      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
      - name: Test frontend and Rust
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build macOS application bundle
        run: npm run tauri build -- --bundles app
      - name: Install and verify application bundle
        run: |
          applications_dir="$RUNNER_TEMP/Applications"
          bash scripts/install-macos-desktop.sh --applications-dir "$applications_dir"
          bash scripts/install-macos-desktop.sh --applications-dir "$applications_dir"
          app="$applications_dir/Trace ML.app"
          test -d "$app"
          test -f "$app/Contents/Resources/icon.icns"
          identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")"
          test "$identifier" = "com.avifenesh.traceml"
