name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-bundle:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Reproduce local setup
        run: make setup
      - name: Verify setup leaves source unchanged
        run: |
          status="$(git status --porcelain)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            git diff
            exit 1
          fi
      - name: Run fast quality gates
        run: make check
      - name: Build macOS application bundle
        run: npm run tauri -- build --bundles app -- --locked
      - name: Install and verify application bundle
        run: |
          applications_dir="$RUNNER_TEMP/Applications"
          bash scripts/install-macos-desktop.sh --applications-dir "$applications_dir"
          bash scripts/install-macos-desktop.sh --applications-dir "$applications_dir"
          app="$applications_dir/Trace ML.app"
          test -d "$app"
          test -f "$app/Contents/Resources/icon.icns"
          test -f "$app/Contents/Resources/LICENSE"
          test -f "$app/Contents/Resources/THIRD_PARTY_NOTICES.md"
          identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")"
          test "$identifier" = "com.avifenesh.traceml"
      - name: Launch installed application through Launch Services
        run: |
          bash scripts/smoke-installed-macos.sh \
            --applications-dir "$RUNNER_TEMP/Applications"
      - name: Verify repository remains clean
        run: |
          git diff --check
          status="$(git status --porcelain)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            git diff
            exit 1
          fi
