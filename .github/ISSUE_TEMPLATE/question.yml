name: Question
description: Ask about setup, development, contribution, or project scope.
title: "[Question]: "
labels:
  - question
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Include the context needed to answer without private data.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you already checked?
      description: Link the relevant README section or command output when useful.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This is not a vulnerability report and contains no credentials or learner data.
          required: true
